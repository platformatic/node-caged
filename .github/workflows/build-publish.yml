# Multi-architecture Docker build and publish workflow
# Builds Node.js with pointer compression for amd64 and arm64
# Supports three variants: bookworm (Debian), slim (minimal), alpine
# Supports multiple Node.js majors: 25.x and 26.x
#
# Features:
# - Manual trigger only (workflow_dispatch)
# - Choose which Node.js major to build (25, 26, or all)
# - Automatically detects latest release for each selected major
# - Skips a major if its current version already exists on DockerHub
# - Force rebuild option to bypass version check

name: Build and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      node_major:
        description: 'Which Node.js major to build'
        type: choice
        options:
          - all
          - '25'
          - '26'
        default: all
      force:
        description: 'Force rebuild even if version exists on DockerHub'
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: platformatic/node-caged
  # The major that owns floating tags (`latest`, `bookworm`, `slim`, `alpine`,
  # `{version}`, `{version}-{variant}` without major prefix).
  LATEST_MAJOR: '26'

jobs:
  # =============================================================================
  # Phase 1: Resolve which (major, version) pairs need building
  # =============================================================================
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compute.outputs.should_build }}
      builds_matrix: ${{ steps.compute.outputs.builds_matrix }}
    steps:
      - name: Compute build matrix
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_MAJOR_INPUT: ${{ inputs.node_major }}
          FORCE: ${{ inputs.force }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          if [ "$NODE_MAJOR_INPUT" = "all" ]; then
            MAJORS=(25 26)
          else
            MAJORS=("$NODE_MAJOR_INPUT")
          fi

          BUILDS="[]"

          for MAJOR in "${MAJORS[@]}"; do
            echo "::group::Resolving Node.js v${MAJOR}.x"

            VERSION=$(gh api repos/nodejs/node/releases --paginate \
              --jq "[.[] | select(.tag_name | startswith(\"v${MAJOR}.\")) | .tag_name][0]" \
              | sed 's/^v//')

            if [ -z "$VERSION" ]; then
              echo "No published v${MAJOR}.x release found, will build from v${MAJOR}.x branch tip"
              VERSION="${MAJOR}.x"
            else
              echo "Latest v${MAJOR}.x version: $VERSION"
            fi

            if [ "$FORCE" = "true" ]; then
              echo "Force rebuild requested for v${MAJOR}.x"
              SHOULD=true
            elif [[ "$VERSION" == *.x ]]; then
              # Branch tips don't have stable version tags; always rebuild
              echo "Building from branch tip, will rebuild"
              SHOULD=true
            else
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}-bookworm")
              if [ "$STATUS" = "200" ]; then
                echo "Version $VERSION already exists on DockerHub, skipping"
                SHOULD=false
              else
                echo "Version $VERSION not on DockerHub (status $STATUS), will build"
                SHOULD=true
              fi
            fi

            if [ "$SHOULD" = "true" ]; then
              BUILDS=$(echo "$BUILDS" | jq -c \
                --arg major "$MAJOR" \
                --arg version "$VERSION" \
                '. + [{major: $major, version: $version}]')
            fi

            echo "::endgroup::"
          done

          echo "Computed builds: $BUILDS"
          COUNT=$(echo "$BUILDS" | jq 'length')

          echo "builds_matrix=$BUILDS" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "## Build Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Selected major:** ${{ inputs.node_major }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force rebuild:** ${{ inputs.force }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Should build:** ${{ steps.compute.outputs.should_build }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Builds:** \`${{ steps.compute.outputs.builds_matrix }}\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Phase 2: Build images for each (major, variant, arch) combination
  # =============================================================================
  build:
    runs-on: ${{ matrix.runner }}
    environment: build
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.check.outputs.builds_matrix) }}
        variant: [bookworm, slim, alpine]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.variant }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            NODE_VERSION=v${{ matrix.build.version }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.build.major }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.build.major }}-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.build.major }}/${{ matrix.variant }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.build.major }}/${{ matrix.variant }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.build.major }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.build.major }}/${{ matrix.variant }}/*
          if-no-files-found: error
          retention-days: 1

  # =============================================================================
  # Phase 3: Create multi-arch manifests for each (major, variant)
  # =============================================================================
  merge:
    runs-on: ubuntu-latest
    environment: build
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    strategy:
      matrix:
        build: ${{ fromJSON(needs.check.outputs.builds_matrix) }}
        variant: [bookworm, slim, alpine]

    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.build.major }}-${{ matrix.variant }}-amd64
          path: /tmp/digests/${{ matrix.build.major }}/${{ matrix.variant }}

      - name: Download arm64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.build.major }}-${{ matrix.variant }}-arm64
          path: /tmp/digests/${{ matrix.build.major }}/${{ matrix.variant }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ matrix.build.major }}/${{ matrix.variant }}
        run: |
          NODE_VERSION="${{ matrix.build.version }}"
          MAJOR_VERSION="${{ matrix.build.major }}"
          VARIANT="${{ matrix.variant }}"
          IS_LATEST_MAJOR="false"
          if [ "$MAJOR_VERSION" = "${{ env.LATEST_MAJOR }}" ]; then
            IS_LATEST_MAJOR="true"
          fi

          echo "Creating manifest for Node.js $NODE_VERSION (major: $MAJOR_VERSION) - $VARIANT"
          echo "Is latest major: $IS_LATEST_MAJOR"

          DIGESTS=$(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

          TAGS=""

          # Always: major-variant tag (e.g. 25-bookworm, 26-bookworm)
          TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR_VERSION}-${VARIANT}"

          # Always: full version-variant tag (skip when version is a branch tip)
          if [[ "$NODE_VERSION" != *.x ]]; then
            TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${NODE_VERSION}-${VARIANT}"
          fi

          # Only the highest major owns floating variant-only tags (bookworm, slim, alpine)
          if [ "$IS_LATEST_MAJOR" = "true" ]; then
            TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VARIANT}"
          fi

          # bookworm is the default variant — gets unsuffixed major/version/latest tags
          if [ "$VARIANT" = "bookworm" ]; then
            TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR_VERSION}"
            if [[ "$NODE_VERSION" != *.x ]]; then
              TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${NODE_VERSION}"
            fi
            if [ "$IS_LATEST_MAJOR" = "true" ]; then
              TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            fi
          fi

          echo "Tags: $TAGS"

          docker buildx imagetools create $TAGS $DIGESTS

      - name: Inspect manifest
        run: |
          echo "Inspecting manifest for ${{ matrix.build.major }}/${{ matrix.variant }}..."
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.build.major }}-${{ matrix.variant }}

  # =============================================================================
  # Phase 4: Test the published images
  # =============================================================================
  test:
    runs-on: ${{ matrix.runner }}
    environment: build
    needs: [check, merge]
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.check.outputs.builds_matrix) }}
        variant: [bookworm, slim, alpine]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and test image
        run: |
          NODE_VERSION="${{ matrix.build.version }}"
          MAJOR="${{ matrix.build.major }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR}-${{ matrix.variant }}"

          echo "Testing $IMAGE on ${{ matrix.arch }}..."
          echo "Expected Node.js version: $NODE_VERSION"

          docker pull "$IMAGE"

          ACTUAL_VERSION=$(docker run --rm "$IMAGE" node --version | sed 's/^v//')
          echo "Actual Node.js version: $ACTUAL_VERSION"

          # Skip strict version check when building branch tip (no stable tag yet)
          if [[ "$NODE_VERSION" != *.x ]] && [ "$ACTUAL_VERSION" != "$NODE_VERSION" ]; then
            echo "ERROR: Version mismatch! Expected $NODE_VERSION but got $ACTUAL_VERSION"
            exit 1
          fi

          ACTUAL_MAJOR="${ACTUAL_VERSION%%.*}"
          if [ "$ACTUAL_MAJOR" != "$MAJOR" ]; then
            echo "ERROR: Major mismatch! Expected $MAJOR but got $ACTUAL_MAJOR"
            exit 1
          fi

          docker run --rm \
            -v ${{ github.workspace }}/tests:/tests:ro \
            "$IMAGE" \
            node /tests/verify-pointer-compression.js

  # =============================================================================
  # Summary job - runs even when build is skipped
  # =============================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [check, test]
    if: always()
    steps:
      - name: Generate summary
        env:
          BUILDS_MATRIX: ${{ needs.check.outputs.builds_matrix }}
          SHOULD_BUILD: ${{ needs.check.outputs.should_build }}
          LATEST_MAJOR: ${{ env.LATEST_MAJOR }}
        run: |
          echo "## Build Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Selected major | ${{ inputs.node_major }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Force rebuild | ${{ inputs.force }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build executed | $SHOULD_BUILD |" >> $GITHUB_STEP_SUMMARY

          if [ "$SHOULD_BUILD" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Published builds" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$BUILDS_MATRIX" | jq -r '.[] | "- Node.js v\(.version) (major \(.major))"' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Floating tags (\`latest\`, \`bookworm\`, \`slim\`, \`alpine\`) are owned by major \`$LATEST_MAJOR\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All selected majors are already published on DockerHub. Re-run with **Force rebuild** to bypass the version check." >> $GITHUB_STEP_SUMMARY
          fi
